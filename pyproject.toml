[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-quant-summarizer"
version = "0.1.0"
description = "YouTube Quantitative Investment Strategy Summarizer & Knowledge Extractor"
authors = [{ name = "Quant Learner" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "yt-dlp>=2024.1.0",
    "youtube-transcript-api>=0.6.2",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
]

[project.scripts]
yt-quant = "summarizer.cli:app"

[tool.setuptools.packages.find]
include = ["summarizer*"]